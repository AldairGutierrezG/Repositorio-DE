<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Repositorio</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f9;
  margin:0;
}

header{
  background:#003366;
  color:white;
  text-align:center;
  padding:20px;
}

.contenedor{
  display:flex;
  min-height:85vh;
}

.menu{
  width:280px;
  background:white;
  padding:20px;
  box-shadow:2px 0 8px rgba(0,0,0,0.15);
}

.menu button{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

.activa{
  background:#003366;
  color:white;
}

.bloqueada{
  background:#ddd;
  color:#777;
  cursor:not-allowed;
}

.visualizador{
  flex:1;
  padding:25px;
  overflow-y:auto;
}

.bloque-material{
  background:white;
  padding:20px;
  margin-bottom:30px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.bloque-material h2{
  color:#003366;
  margin-top:0;
}

iframe{
  width:100%;
  height:75vh;
  border:none;
  border-radius:10px;
  background:white;
}

.mensaje{
  background:white;
  padding:30px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}
</style>
</head>

<body>

<header>
  <h1>Repositorio</h1>
  <p>Diagnósticos Energéticos</p>
</header>

<div class="contenedor">

  <div class="menu" id="menu"></div>

  <div class="visualizador" id="visualizador">
    <div class="mensaje">
      <h2>Selecciona una unidad</h2>
      <p>Elige una unidad desbloqueada para visualizar sus materiales.</p>
    </div>
  </div>

</div>

<script>
const unidades = [
  {
    nombre: "Unidad 1",
    activa: true,
    recursos: [
      {
        titulo: "Presentación Unidad 1",
        tipo: "presentacion",
        url: "https://docs.google.com/presentation/d/e/2PACX-1vRiAPT1yckIfP0Jmb3LGo40erotz0txJyxu4-PxppPqe-nC6F8SwO8cB1rQMzvHYw/pubembed?start=false&loop=false&delayms=5000"
      }
    ]
  },

  {
    nombre: "Unidad 2",
    activa: true,
    recursos: [
      {
        titulo: "Presentación Unidad 2",
        tipo: "presentacion",
        url: "https://docs.google.com/presentation/d/e/2PACX-1vSsnZ_JrpSxMRdTvqwNSvouJZ3tdKR4aSzGFqtTBpi3uJfTlQGwy44cVMlXbv7kpw/pubembed?start=false&loop=false&delayms=5000"
      },
      {
        titulo: "PDF Unidad 2",
        tipo: "pdf",
        url: "https://drive.google.com/file/d/1LCmPadma5z89D9Tcp8CiruNLRZyQvPnp/preview"
      },
      {
        titulo: "Video Unidad 2",
        tipo: "video",
        url: "https://drive.google.com/file/d/1AgbEqqudmTYVySiv50ahGjHzeGxAaAMz/preview"
      }
    ]
  },

  {
    nombre: "Unidad 3",
    activa: false,
    recursos: [
      {
        titulo: "Presentación Unidad 3",
        tipo: "presentacion",
        url: "PEGA_AQUI_EL_ENLACE_DE_LA_UNIDAD_3"
      }
    ]
  }
];

const menu = document.getElementById("menu");
const visualizador = document.getElementById("visualizador");

unidades.forEach((unidad) => {
  const boton = document.createElement("button");

  boton.textContent = unidad.activa ? unidad.nombre : unidad.nombre + " 🔒";
  boton.className = unidad.activa ? "activa" : "bloqueada";

  boton.onclick = () => {
    if(unidad.activa){
      mostrarUnidadCompleta(unidad);
    } else {
      visualizador.innerHTML = `
        <div class="mensaje">
          <h2>${unidad.nombre} bloqueada 🔒</h2>
          <p>Esta unidad estará disponible cuando el docente la active.</p>
        </div>
      `;
    }
  };

  menu.appendChild(boton);
});

function mostrarUnidadCompleta(unidad){
  let contenido = `
    <h1>${unidad.nombre}</h1>
  `;

  unidad.recursos.forEach((recurso) => {
    contenido += `
      <section class="bloque-material">
        <h2>${icono(recurso.tipo)} ${recurso.titulo}</h2>
        <iframe src="${recurso.url}" allowfullscreen></iframe>
      </section>
    `;
  });

  visualizador.innerHTML = contenido;
  visualizador.scrollTop = 0;
}

function icono(tipo){
  if(tipo === "presentacion") return "📊";
  if(tipo === "pdf") return "📕";
  if(tipo === "video") return "▶️";
  return "📁";
}
</script>

</body>
</html>
